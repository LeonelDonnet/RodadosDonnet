<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rodados Donnet</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        
        .login-container {
            background: #2d2d2d;
            padding: 40px;
            border-radius: 10px;
            border: 1px solid #444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .login-header p {
            color: #ccc;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
            color: white;
        }
        
        .form-group input:focus {
            border-color: #ff4444;
            outline: none;
        }
        
        .form-group input::placeholder {
            color: #888;
        }
        
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #FFD700;
            color: #1a1a1a;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }
        
        .login-btn:hover {
            background: #cc3333;
        }
        
        .error-message {
            color: #ff4444;
            text-align: center;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1> Rodados Donnet</h1>
            <p>Acceso exclusivo para personal autorizado</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <button type="submit" class="login-btn">Ingresar</button>
        </form>
        
        <p class="error-message" id="errorMessage">Usuario o contraseña incorrectos</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            
            // Cred
            const validUsername = 'admin';
            const validPassword = 'rodados1234';
            
            if (username === validUsername && password === validPassword) {
                // save en localStorage y redirigir
                localStorage.setItem('rodadosAuth', 'true');
                localStorage.setItem('loginTime', new Date().getTime());
                window.location.href = 'index.html';
            } else {
                errorMessage.style.display = 'block';
                // cleen
                document.getElementById('password').value = '';
            }
        });
    </script>
</body>
</html>
